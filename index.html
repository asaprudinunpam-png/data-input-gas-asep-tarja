<style>
:root{--green:#18b84b;--green2:#0b8f37;--bg:#f3fff6;--red:#e53935;--dark:#202520}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--dark)}
header{background:linear-gradient(135deg,#19c653,#078b35);color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}

main{padding:12px;max-width:1000px;margin:auto}.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px #00000012}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}

button.action{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}
.primary{background:var(--green);color:#fff}.secondary{background:#eee;color:#222}.danger{background:#e53935;color:#fff}
.member{border:1px solid #ddd;border-radius:10px;padding:10px;margin:7px 0;background:#fff}
.member.marked{background:#bfe3ff;border-color:#168bd1}
.member .top{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800}.nik{font-size:12px;color:#666}
.status{font-weight:800;padding:3px 7px;border-radius:999px;font-size:10px}.s1{background:#e4f7ea;color:#159447}.s0{background:#fff8cf;color:#b69a00}.se{background:#ffe3e3;color:#d62929}.sb{background:#eee;color:#555}
.buttons{display:flex;gap:6px;margin-top:8px}.buttons button{flex:1;border-radius:7px;padding:8px 4px;font-weight:800}.bisa{color:#159447;background:#fff;border:1px solid #9bd8b2}.penuh{color:#c7a400;background:#fff;border:1px solid #e6d36a}.error{color:#d62929;background:#fff;border:1px solid #e6a0a0}.clear{color:#555;background:#fff;border:1px solid #bbb}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:7px;text-align:center}th{background:#e9f8ed}
.small{font-size:12px;color:#666}.hidden{display:none}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 15px;border-radius:8px;z-index:20;display:none}
@media(min-width:700px){.member{display:grid;grid-template-columns:1fr 160px 360px;align-items:center;gap:10px}.member .buttons{margin:0}}
@media print{
  @page{size:landscape;margin:6mm}
  body{background:#fff!important;margin:0!important}nav,header,.no-print,main>section:not(#print),#print>.card{display:none!important}
  #print{display:block!important}
  .print-only{display:block!important}
  .print-sheet{page-break-after:always;break-after:page;width:100%;margin:0;padding:0}
  .print-sheet:last-child{page-break-after:auto;break-after:auto}
}
.print-only{display:none}
.print-preview{overflow-x:auto;background:#f3f5f3;padding:10px}
.print-sheet{background:#fff;margin:0 auto 16px;padding:10px;box-sizing:border-box}
.print-title{text-align:center;font-weight:800;font-size:16px;margin-bottom:6px}
.print-meta{font-size:10px;line-height:1.45;margin-bottom:5px}
.print-grid{border-collapse:collapse;width:100%;min-width:0;table-layout:fixed;font-size:6.5px}
.print-grid th,.print-grid td{border:1px solid #222;text-align:center;padding:2px 1px;height:18px;box-sizing:border-box}
.print-grid .left{text-align:left}
.print-grid .no{width:28px;min-width:28px;max-width:28px}
.print-grid .name{width:150px;min-width:150px;max-width:150px;padding-left:8px!important;padding-right:8px!important;white-space:normal;overflow:hidden;overflow-wrap:anywhere;vertical-align:middle;line-height:1.05}
.print-grid .nik{width:145px;min-width:145px;max-width:145px;padding-left:8px!important;padding-right:8px!important;white-space:nowrap;overflow:hidden;vertical-align:middle}

.print-grid .day{width:auto;min-width:0;max-width:none}
.print-check{font-size:11px;font-weight:800}
@media screen{.print-grid{min-width:1050px}}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #ddd;border-radius:10px}
.input-table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.input-table th,.input-table td{border-right:1px solid #ddd;border-bottom:1px solid #ddd;padding:6px 5px;white-space:nowrap;text-align:center;background:#fff}
.input-table th{position:sticky;top:0;z-index:2;background:#e9f8ed;font-weight:800}
.input-table .left{text-align:left}
.input-table .no{position:sticky;left:0;z-index:3;background:#fff;min-width:42px}
.input-table th.no{background:#e9f8ed}
.input-table .nama{min-width:155px}
.input-table .nik{min-width:145px}
.input-table .copy{min-width:60px}
.input-table .jml{min-width:48px;font-weight:800}
.copybtn{border:1px solid #c8c8c8;background:#f7f7f7;border-radius:6px;padding:6px 8px;font-weight:800;font-size:11px}
.statusbtn{border:1px solid #ccc;border-radius:6px;padding:6px 8px;font-weight:900;background:#fff;min-width:52px;font-size:11px}
.statusbtn.bisa{color:#159447;border-color:#9bd8b2}
.statusbtn.penuh{color:#c7a400;border-color:#e6d36a}
.statusbtn.error{color:#d62929;border-color:#e6a0a0}
.statusbtn.batal{color:#555;border-color:#bbb}
.pagebar{display:grid;grid-template-columns:repeat(13,1fr);gap:5px;padding:7px 0 9px;background:var(--bg);z-index:3;align-items:center}
.pagebar button{border:1px solid #b9d8c1;background:#fff;border-radius:9px;padding:7px 2px;font-weight:900;font-size:11px;color:#27733e;box-shadow:0 1px 3px #0001;align-self:center;min-height:31px}
.pagebar button.active{background:linear-gradient(135deg,#19c653,#078b35);color:#fff;border-color:#078b35;box-shadow:0 3px 8px #078b3555;padding-top:11px;padding-bottom:11px;font-size:14px;position:relative;z-index:2}
.pagebar button.marked-page{background:#2196f3;color:#fff;border-color:#1976d2;box-shadow:0 2px 5px #1976d240}
.pagebar button.active.marked-page{background:#2196f3;color:#fff;border-color:#1976d2;padding-top:11px;padding-bottom:11px;font-size:14px;position:relative;z-index:2}
@media(max-width:600px){.pagebar button.active,.pagebar button.active.marked-page{padding-top:10px;padding-bottom:10px;font-size:13px}}
.calendar-wrap{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 10px}.calendar-wrap input{padding:8px 10px;border:1px solid #bbb;border-radius:8px;font-size:13px;font-weight:700}.datebar{display:flex;gap:5px;overflow-x:auto;padding:4px 0 9px}
.datebar button{border:1px solid #ccc;background:#fff;border-radius:7px;padding:7px 10px;font-weight:700;flex:0 0 auto}
.datebar button.active{background:#19c653;color:#fff;border-color:#19c653}
.current-cell{outline:2px solid #19c653;outline-offset:-2px}
.manual-actions button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.7)}

.page-mark-notice{margin:2px 0 4px;padding:7px 10px;border-radius:9px;background:#eaf4ff;border:1px solid #9bc7f5;color:#155a96;text-align:center;font-weight:800;font-size:12px;min-height:18px}
.page-mark-notice:empty{display:none}
</style>
<style>
.input-table-wrap{margin-top:8px;overflow-x:auto;overflow-y:visible;width:100%;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.input-table{width:max-content;min-width:820px;table-layout:auto;border-collapse:collapse;font-size:12px}
.input-table th,.input-table td{border:1px solid #ddd;padding:6px 5px;text-align:center;white-space:nowrap}
.input-table th{background:#e9f8ed;font-weight:800}
.input-table td.left{text-align:left}
.input-table .sticky-no{width:38px;min-width:38px}.input-table th:nth-child(2),.input-table td:nth-child(2){min-width:150px}.input-table th:nth-child(3),.input-table td:nth-child(3){min-width:150px}.input-table th:nth-child(4),.input-table td:nth-child(4){min-width:410px}.input-table th:nth-child(5),.input-table td:nth-child(5){min-width:45px}

.three-actions{display:flex;gap:8px;justify-content:center;width:max-content;min-width:400px}
.three-actions .mini-status{min-width:88px;flex:0 0 88px}.three-actions .mini-status:disabled{opacity:.35;cursor:not-allowed;background:#f3f3f3}.three-actions .mini-status.active{font-weight:900;box-shadow:inset 0 0 0 2px currentColor;color:#fff}.three-actions .mini-status.bisa.active{background:#18b84b;border-color:#18b84b}.three-actions .mini-status.penuh.active{background:#d4b000;border-color:#d4b000}.three-actions .mini-status.error.active{background:#d62929;border-color:#d62929}.three-actions .mini-status.batal{color:#555;border-color:#aaa}.three-actions .mini-status.batal:hover{background:#eee}

.input-table th:nth-child(2),.input-table td:nth-child(2){min-width:150px;width:150px}
.input-table th:nth-child(3),.input-table td:nth-child(3){min-width:150px;width:150px}
.input-table th:nth-child(4),.input-table td:nth-child(4){min-width:410px;width:410px}
.input-table th:nth-child(5),.input-table td:nth-child(5){min-width:45px;width:45px}
.next-input{margin-top:7px;font-size:11px;font-weight:800;color:#0b8f37;text-align:left}
.manual-actions button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.7)}
</style>
<style>
.action-help{font-size:12px!important;line-height:1.25!important;font-weight:600!important;margin-top:5px!important;padding:5px 8px!important;text-align:center!important}
.rekap-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.rekap-stat{border:1px solid #ddd;border-radius:8px;background:#fff;padding:7px 5px;text-align:center}.rekap-stat b{display:block;font-size:11px}.rekap-stat strong{font-size:18px;display:block;margin-top:2px}.rekap-title{text-align:center;font-weight:900;font-size:13px;margin:8px 0}.rekap-can-input{border:1px solid #b7d9c0;border-radius:8px;background:#eefaf1;padding:9px 10px;margin:0 0 12px;text-align:center}.rekap-can-input b{display:block;font-size:11px}.rekap-can-input strong{display:block;font-size:22px;margin:2px 0}.rekap-can-input span{display:block;font-size:10px;color:#666}.rekap-table-wrap{overflow-x:auto}.rekap-table{min-width:620px;border-collapse:collapse;font-size:12px}.rekap-table th,.rekap-table td{border:1px solid #ddd;padding:7px;text-align:center}.rekap-table th{background:#e9f8ed}.rekap-table td.nama{text-align:left;min-width:150px}.rekap-table td.nik{min-width:140px;color:#222;font-size:12px}.datebar .active{background:#19c653!important;color:#fff!important;border-color:#19c653!important}

.rekap-stat span{display:block;font-size:9px;color:#777;margin-top:1px}.recap-filter{display:flex;justify-content:center;gap:7px;margin:8px 0}.recap-filter button{border:1px solid #bbb;background:#fff;border-radius:8px;padding:8px 18px;font-size:12px;font-weight:800;cursor:pointer}.recap-filter button.active{color:#fff}.recap-filter button[data-value="1"].active{background:#18b84b;border-color:#18b84b}.recap-filter button[data-value="0"].active{background:#d4b000;border-color:#d4b000}.recap-filter button[data-value="-"].active{background:#d62929;border-color:#d62929}

.mark-summary{font-size:12px;text-align:center;margin:8px 0;font-weight:700}.mark-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.mark-table{width:max-content;min-width:100%;border-collapse:collapse;font-size:12px}.mark-table th,.mark-table td{border:1px solid #ddd;padding:7px 8px;text-align:center;white-space:nowrap}.mark-table th{background:#e9f8ed}.mark-table td.name{text-align:left;min-width:150px}.mark-table td.nik{min-width:145px;color:#222;font-size:12px}.mark-table .markbtn{border:1px solid #168bd1;background:#fff;border-radius:7px;padding:8px 10px;font-weight:800;color:#1677ad}.mark-table .cancelbtn{border:1px solid #aaa;background:#fff;border-radius:7px;padding:8px 10px;font-weight:800;color:#555}.mark-table .editbtn{border:1px solid #c8c8c8;background:#fff;border-radius:7px;padding:8px 10px;font-weight:800}.mark-table tr.marked td{background:#bfe3ff}.mark-table .page-cell{font-weight:800;color:#27733e}

<style id="action-below-nik">
.nik-actions-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.nik-actions-wrap .nik{display:block;text-align:center}
.nik-actions{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}

 renderMembers();

}

 const n=members.filter(m=>m.halaman===currentPage&&m.ditandai).length;

}

 const pageHtml=ps.map(p=>`<button class="${p===currentPage?'active':''}" onclick="setPage('${p}')">${p.replace("HAL ","")}</button>`).join("");
 document.getElementById("pagebar").innerHTML=pageHtml;
 const pb=document.getElementById("pagebarBottom"); if(pb) pb.innerHTML=pageHtml;
 document.getElementById("markPagebar").innerHTML=ps.map(p=>`<button class="${p===currentMarkPage?'active':''}" onclick="setMarkPage('${p}')">${p.replace("HAL ","")}</button>`).join("");
 document.getElementById("printPagebar").innerHTML=ps.map(p=>`<button class="${p===currentPrintPage?'active':''}" onclick="setPrintPage('${p}')">${p.replace("HAL ","")}</button>`).join("");
 updatePageMarkNotice();
}
function buildDateBar(){
 let h=dates().map(d=>`<button class="${d===currentDate?'active':''}" onclick="setDate(${d})">${d}</button>`).join("");
 const iso0=`${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(currentDate).padStart(2,'0')}`;
 const im=document.getElementById('inputMonth'); if(im) im.value=`${currentYear}-${String(currentMonth).padStart(2,'0')}`; const rm=document.getElementById('rekapMonth'); if(rm) rm.value=`${currentYear}-${String(currentMonth).padStart(2,'0')}`;
 const md=document.getElementById("manualDate"), xd=document.getElementById("massDate");
 if(md){md.value=iso0;}
 if(xd){xd.value=iso0;}
 const cal=document.getElementById('rekapCalendar'); if(cal){cal.value=`${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(currentDate).padStart(2,'0')}`;}
}
function setPage(p){currentPage=p;buildPageBar(pages());renderMembers(); window.scrollTo({top:0,behavior:'smooth'});}
function setDate(d){currentDate=+d;buildDateBar();renderMembers()}
function setInputMonth(v){const [y,m]=String(v).split('-').map(Number); if(y&&m){currentYear=y;currentMonth=m; currentDate=Math.min(currentDate,new Date(y,m,0).getDate()); buildDateBar(); renderMembers(); renderMarks(); updateMarkInfo(); updatePageMarkNotice();}}
function setRecapMonth(v){const [y,m]=String(v).split('-').map(Number); if(y&&m){currentYear=y;currentMonth=m; currentDate=Math.min(currentDate,new Date(y,m,0).getDate()); buildDateBar(); loadRecap(currentDate); renderMembers(); renderMarks(); updateMarkInfo(); updatePageMarkNotice();}}
function readManualDay(id){
 const el=document.getElementById(id);
 if(!el||!el.value)return currentDate;
 const parts=el.value.split('-');
 return +(parts[2]||currentDate);
}

function setMarkPage(p){currentMarkPage=p;buildPageBar(pages());renderMarks();updateMarkInfo()}
function setPrintPage(p){currentPrintPage=p;buildPageBar(pages())}

function monthKey(){return `${currentYear}-${String(currentMonth).padStart(2,'0')}`}
function sameMonthDate(t){return +t>=1&&+t<=31}
function latestStatus(m,val){
  return inputs.filter(x=>x.halaman===m.halaman&&+x.no===+m.no&&x.nilai===val&&sameMonthDate(x.tanggal)).sort((a,b)=>{
    const da=new Date(+a.tahun,+a.bulan-1,+a.tanggal).getTime();
    const db=new Date(+b.tahun,+b.bulan-1,+b.tanggal).getTime();
    return db-da;
  })[0]||null;
}
function dateObj(y,m,d){return new Date(+y,+m-1,+d);}
function fmtDate(y,m,d){
 const bl=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
 return `${+d} ${bl[+m-1]} ${+y}`;
}
function lastBisaInfo(m,d){
 const target=dateObj(currentYear,currentMonth,d);
 return inputs.filter(x=>x.halaman===m.halaman&&+x.no===+m.no&&x.nilai==='1'&&sameMonthDate(x.tanggal))
   .map(x=>({x,date:dateObj(x.tahun,x.bulan,x.tanggal)}))
   .filter(o=>o.date.getTime()<=target.getTime())
   .sort((a,b)=>b.date-a.date)[0]||null;
}
function rules(m,d){
  const cur=getVal(m,d);
  const memberInputs=inputs.filter(x=>x.halaman===m.halaman&&+x.no===+m.no&&periodMatch(x));
  const penuh=memberInputs.some(x=>x.nilai==='0');
  const hasError=inputs.some(x=>x.halaman===m.halaman&&+x.no===+m.no&&x.nilai==='-');
  const lastInfo=lastBisaInfo(m,d);
  const target=dateObj(currentYear,currentMonth,d);
  const diff=lastInfo?Math.floor((target-lastInfo.date)/86400000):999999;
  const bisaBlockedByGap=!!lastInfo && diff<5;
  const currentHasStatus=!!cur;
  return {cur,penuh,hasError,bisaBlockedByGap,currentHasStatus,lastBisa:lastInfo?.x||null,daysSinceBisa:diff,
    bisaDisabled:currentHasStatus || penuh || hasError || bisaBlockedByGap,
    penuhDisabled:currentHasStatus || hasError,
    errorDisabled:currentHasStatus || penuh};
}
function nextBisaDate(m,d){
 const lastInfo=lastBisaInfo(m,d);
 if(!lastInfo)return null;
 const n=new Date(lastInfo.date); n.setDate(n.getDate()+5);
 return {date:n, label:fmtDate(n.getFullYear(),n.getMonth()+1,n.getDate())};
}
function nextInputText(m,d,v){
 const r=rules(m,d);
 if(r.currentHasStatus){
   if(v==='1' || r.cur==='1') return `BISA — sudah diinput ${fmtDate(currentYear,currentMonth,d)}`;
   if(v==='0' || r.cur==='0') return `PENUH — sudah diinput ${fmtDate(currentYear,currentMonth,d)}`;
   if(v==='-' || r.cur==='-') return `ERROR — sudah diinput ${fmtDate(currentYear,currentMonth,d)}`;
 }
 if(r.penuh) return 'PENUH — tidak bisa diinput sampai awal bulan';
 if(r.hasError) return 'ERROR — tidak bisa diinput sampai diperbaiki atau BATAL';
 if(r.bisaBlockedByGap){
   const nx=nextBisaDate(m,d);
   return nx ? `Bisa diinput kembali ${nx.label}` : 'Belum lewat 5 hari sejak input BISA terakhir';
 }
 return '';
}

function actionHelp(m,d,val){
 const r=rules(m,d);
 const namaBulan=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][new Date().getMonth()];

 if(val==='1' && r.bisaBlockedByGap){
   const next=nextBisaDate(m,d);
   return next && next<=31 ? `Bisa diinput kembali ${next} ${namaBulan}` : 'Bisa diinput kembali awal bulan';
 }
 return '';
}

 filtered=members.filter(m=>m.halaman===p&&(((m.nik||"").toLowerCase().includes(q))||((m.nama||"").toLowerCase().includes(q))));

   </div>`;
 }).join("");
 document.getElementById("members").innerHTML=`
 <div class="person-list">${cards}</div>`;

}

async function markOne(hal,no){

async function autoMark(){
  const n=Math.max(1,Number(document.getElementById("markCount")?.value)||1);
  const eligible=members.filter(m=>{
    if(m.ditandai) return false;
    const r=rules(m,currentDate);
    if(r.penuh || r.hasError || r.bisaBlockedByGap) return false;
    if(getVal(m,currentDate)) return false;
    return true;
  });
  if(!eligible.length){toast("Tidak ada NIK yang bisa ditandai");return}
  const countAllInputs=m=>inputs.filter(x=>x.halaman===m.halaman && +x.no===+m.no && x.nilai!=="").length;
  const countBisaInputs=m=>inputs.filter(x=>x.halaman===m.halaman && +x.no===+m.no && x.nilai==='1').length;
  const lastInputDate=m=>{
    const ds=inputs.filter(x=>x.halaman===m.halaman && +x.no===+m.no && x.nilai!=="").map(x=>+x.tanggal).filter(Number.isFinite);
    return ds.length?Math.max(...ds):0;
  };
  eligible.sort((a,b)=>{
    const ai=countAllInputs(a),bi=countAllInputs(b); if(ai!==bi)return ai-bi;
    const ab=countBisaInputs(a),bb=countBisaInputs(b); if(ab!==bb)return ab-bb;
    const al=lastInputDate(a),bl=lastInputDate(b); if(al!==bl)return (al||0)-(bl||0);
    return (+a.no)-(+b.no);
  });
  const byPage=new Map();
  for(const m of eligible){if(!byPage.has(m.halaman))byPage.set(m.halaman,[]);byPage.get(m.halaman).push(m)}
  const pageNames=[...byPage.keys()].sort((a,b)=>parseInt(a.replace(/\D/g,''))-parseInt(b.replace(/\D/g,'')));
  const ordered=[]; let round=0,added=true;
  while(added){added=false;for(const pg of pageNames){const list=byPage.get(pg);if(list[round]){ordered.push(list[round]);added=true}}round++}
  const pick=ordered.slice(0,n);
  try{
    for(const m of pick){
      await api(`/rest/v1/gas_members?halaman=eq.${encodeURIComponent(m.halaman)}&no=eq.${m.no}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({ditandai:true})});
      m.ditandai=true;
    }
    renderMarks();renderMembers();updateMarkInfo();updatePageMarkNotice();toast(`${pick.length} NIK ditandai`);
  }catch(e){toast("Gagal menandai: "+e.message)}
}

async function save(hal,no,val){
 const m=members.find(x=>x.halaman===hal&&+x.no===+no);
 if(!m)return;
 const d=currentDate;
 const r=rules(m,d);
 if(val==="1" && r.bisaDisabled){toast(nextInputText(m,d)||"BISA tidak bisa ditekan lagi untuk tanggal ini");return}
 if(val==="-" && r.errorDisabled){toast(r.cur?"Status tanggal ini sudah diinput. Tekan BATAL terlebih dahulu.":"ERROR tidak bisa diubah sebelum diperbaiki atau BATAL");return}
 if(val==="0" && r.penuhDisabled){toast(r.cur?"Status tanggal ini sudah diinput. Tekan BATAL terlebih dahulu.":"PENUH tidak bisa dipilih saat status ERROR");return}
 try{
   const existing=inputs.find(x=>x.halaman===hal&&+x.no===+no&&+x.tanggal===d&&periodMatch(x));
   if(existing){
     await api(`/rest/v1/gas_inputs?id=eq.${encodeURIComponent(existing.id||"")}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({nilai:val,nama:m.nama,nik:m.nik})});
     existing.nilai=val; existing.nama=m.nama; existing.nik=m.nik; existing.created_at=new Date().toISOString();
   }else{
     const body={halaman:hal,no:+no,nama:m.nama,nik:m.nik,tanggal:d,nilai:val,bulan:currentMonth,tahun:currentYear};
     const res=await api(`/rest/v1/gas_inputs`,{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(body)});
     const added=Array.isArray(res)?res[0]:res;
     inputs.push({...body, ...(added||{}), created_at:(added&&added.created_at)||new Date().toISOString()});
   }
   // Status apa pun yang dipilih menghapus tanda biru.
   if(m.ditandai){
     await api(`/rest/v1/gas_members?halaman=eq.${encodeURIComponent(hal)}&no=eq.${no}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({ditandai:false})});
     m.ditandai=false;
   }
   selectedAction={hal,no,date:d,val};
   renderMembers();renderMarks();updateMarkInfo();updatePageMarkNotice();
   if(activeTab==="rekap") await loadRecap(currentDate);
   toast(val==="1"?"BISA tersimpan":val==="0"?"PENUH tersimpan":"ERROR tersimpan");
 }catch(e){toast("Gagal menyimpan: "+e.message)}
}

async function manualInput(mass){
 let d=readManualDay(mass?"massDate":"manualDate");
 let raw=document.getElementById(mass?"massNik":"manualNik").value;
 let niks=raw.split(/[,\s\n]+/).map(x=>x.trim()).filter(Boolean);
 if(!niks.length){toast("NIK belum diisi");return}
 let ok=0, skip=0, reasons=[];
 for(const nik of niks){
  let m=members.find(x=>x.nik===nik);
  if(!m){skip++; reasons.push(`${nik}: NIK tidak ditemukan`); continue}
  let v=getVal(m,d);
  if(v){skip++; reasons.push(`${m.nama}: tanggal ${d} sudah berstatus ${v==='1'?'BISA':v==='0'?'PENUH':'ERROR'}`); continue}
  const r=rules(m,d);
  if(r.bisaBlockedByGap){skip++; reasons.push(`${m.nama}: belum bisa diinput, ${nextInputText(m,d)}`); continue}
  if(r.penuh){skip++; reasons.push(`${m.nama}: PENUH — tidak bisa diinput sampai awal bulan`); continue}
  if(r.hasError){skip++; reasons.push(`${m.nama}: ERROR — tidak bisa diinput sampai diperbaiki atau BATAL`); continue}
  try{
    const body={halaman:m.halaman,no:+m.no,nama:m.nama,nik:m.nik,tanggal:d,nilai:"1",bulan:currentMonth,tahun:currentYear};
    const res=await api(`/rest/v1/gas_inputs`,{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(body)});
    const added=Array.isArray(res)?res[0]:res;
    inputs.push({...body,...(added||{}),created_at:(added&&added.created_at)||new Date().toISOString()});
    ok++;
  }catch(e){skip++; reasons.push(`${m.nama}: gagal menyimpan`)}
 }
 renderMembers();renderMarks();updateMarkInfo();updatePageMarkNotice();
 if(activeTab==="rekap") await loadRecap(currentDate);
 if(reasons.length){
   const head=`${ok} NIK berhasil diinput${skip?` • ${skip} belum diinput`:""}.`;
   toast(head+" "+reasons.slice(0,2).join(" | ")+(reasons.length>2?` • +${reasons.length-2} lainnya`:""));
 }else toast(`${ok} NIK berhasil diinput`);
}

let recapFilter = '1';
function setRecapFilter(v){
  recapFilter=v;
  document.querySelectorAll('.recap-filter button').forEach(b=>b.classList.toggle('active',b.dataset.value===v));
  const cal=document.getElementById('rekapCalendar');
  if(cal && cal.value) loadRecapCalendar(cal.value); else loadRecap(currentDate);
}

function dateKey(y,m,d){ return new Date(+y,+m-1,+d).getTime(); }
function countCanInputBisa(d){
  d=+d;
  const targetKey=dateKey(currentYear,currentMonth,d);
  let total=0;
  members.forEach(m=>{
    // ERROR tetap mengunci NIK sampai diperbaiki/BATAL.
    const hasError=inputs.some(x=>x.halaman===m.halaman&&+x.no===+m.no&&x.nilai==='-');
    if(hasError) return;
    // PENUH hanya mengunci pada bulan berjalan.
    const hasPenuhThisMonth=inputs.some(x=>x.halaman===m.halaman&&+x.no===+m.no&&periodMatch(x)&&x.nilai==='0');
    if(hasPenuhThisMonth) return;
    // Kalau pada tanggal yang dipilih sudah ada input apa pun, tidak dihitung.
    const hasStatusOnDate=inputs.some(x=>x.halaman===m.halaman&&+x.no===+m.no&&periodMatch(x)&&+x.tanggal===d);
    if(hasStatusOnDate) return;
    // Cari BISA terakhir, termasuk bulan sebelumnya, agar batas 5 hari tidak terputus saat ganti bulan.
    const lastBisa=inputs.filter(x=>x.halaman===m.halaman&&+x.no===+m.no&&x.nilai==='1'&&x.bulan&&x.tahun)
      .map(x=>({x,key:dateKey(x.tahun,x.bulan,x.tanggal)}))
      .filter(o=>o.key<=targetKey)
      .sort((a,b)=>b.key-a.key)[0];
    if(lastBisa){
      const diff=Math.floor((targetKey-lastBisa.key)/86400000);
      if(diff<5) return;
    }
    total++;
  });
  return total;
}
async function loadRecap(d){
 d=+d;
 const counts={b:0,p:0,e:0};
 // Rekap kumulatif: tanggal 1 sampai tanggal yang dipilih.
 inputs.forEach(x=>{
    if(periodMatch(x) && +x.tanggal<=d){
     if(x.nilai==='1') counts.b++;
     else if(x.nilai==='0') counts.p++;
     else if(x.nilai==='-') counts.e++;
   }
 });
 const total=counts.b+counts.p+counts.e;
 document.getElementById('rekapStats').innerHTML=`<div class="rekap-stat"><b>JML BISA</b><strong>${counts.b}</strong><span>tgl 1–${d}</span></div><div class="rekap-stat"><b>PENUH</b><strong>${counts.p}</strong><span>tgl 1–${d}</span></div><div class="rekap-stat"><b>ERROR</b><strong>${counts.e}</strong><span>tgl 1–${d}</span></div>`;
 const can=countCanInputBisa(d);
 const ci=document.getElementById('rekapCanInput');
 if(ci) ci.innerHTML=`<div class="rekap-can-input"><b>MASIH BISA DIINPUT</b><strong>${can} NIK</strong><span>Belum ada input pada tanggal ${d} dan sudah lewat minimal 5 hari sejak BISA terakhir.</span></div>`;
 const cal=document.getElementById('rekapCalendar');
 if(cal){
   const y=currentYear, m=String(currentMonth).padStart(2,'0'), dd=String(d).padStart(2,'0');
   cal.value=`${y}-${m}-${dd}`;
 }
 const daily=inputs.filter(x=>periodMatch(x) && +x.tanggal===d && x.nilai===recapFilter)
   .sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0) || String(a.halaman).localeCompare(String(b.halaman),undefined,{numeric:true}) || (+a.no)-(+b.no));
 const rows=daily.map((x,i)=>`<tr><td>${i+1}</td><td class="nama">${esc(x.nama)}</td><td class="nik">${esc(x.nik)}</td><td>Hal ${esc(String(x.halaman).replace(/^HAL\s*/i,''))}</td><td>${x.created_at?new Date(x.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'-'}</td></tr>`).join('');
 const label=recapFilter==='1'?'BISA':recapFilter==='0'?'PENUH':'ERROR';
 document.getElementById('recapBody').innerHTML=`<div class="recap-filter"><button data-value="1" class="${recapFilter==='1'?'active':''}" onclick="setRecapFilter('1')">BISA</button><button data-value="0" class="${recapFilter==='0'?'active':''}" onclick="setRecapFilter('0')">PENUH</button><button data-value="-" class="${recapFilter==='-'?'active':''}" onclick="setRecapFilter('-')">ERROR</button></div><div class="small" style="text-align:center;margin:5px 0 8px">Tanggal ${d} • ${label} • ${daily.length} data</div><div class="rekap-table-wrap"><table class="rekap-table"><tr><th>NO</th><th>NAMA</th><th>NIK</th><th>HALAMAN</th><th>WAKTU DIINPUT</th></tr>${rows||`<tr><td colspan="5">Tidak ada data ${label} pada tanggal ${d}</td></tr>`}</table></div>`;
}
function loadRecapCalendar(value){
 if(!value)return;
 const [y,m,d]=value.split('-').map(Number);
 if(y&&m){currentYear=y;currentMonth=m;currentDate=d||1;buildDateBar();}
 loadRecap(currentDate);
}
async function autoMark(){
  const n=Math.max(1,Number(document.getElementById("markCount")?.value)||1);
  const eligible=members.filter(m=>{
    if(m.ditandai) return false;
    const r=rules(m,currentDate);
    // Tidak boleh ditandai jika PENUH, ERROR, atau masih masa tunggu 5 hari.
    if(r.penuh || r.hasError || r.bisaBlockedByGap) return false;
    // Jika pada tanggal aktif sudah ada input apa pun, jangan tandai.
    if(getVal(m,currentDate)) return false;
    return true;
  });
  if(!eligible.length){toast("Tidak ada NIK yang bisa ditandai");return}

  // Prioritas: belum pernah input sama sekali -> BISA paling sedikit -> input terakhir paling lama.
  const countAllInputs=m=>inputs.filter(x=>x.halaman===m.halaman && +x.no===+m.no && x.nilai!=="").length;
  const countBisaInputs=m=>inputs.filter(x=>x.halaman===m.halaman && +x.no===+m.no && x.nilai==='1').length;
  const lastInputDate=m=>{
    const ds=inputs.filter(x=>x.halaman===m.halaman && +x.no===+m.no && x.nilai!=="").map(x=>+x.tanggal).filter(Number.isFinite);
    return ds.length?Math.max(...ds):0;
  };

  eligible.sort((a,b)=>{
    const ai=countAllInputs(a), bi=countAllInputs(b);
    if(ai!==bi) return ai-bi;
    const ab=countBisaInputs(a), bb=countBisaInputs(b);
    if(ab!==bb) return ab-bb;
    const al=lastInputDate(a), bl=lastInputDate(b);
    if(al!==bl) return (al||0)-(bl||0);
    return (+a.no)-(+b.no);
  });

  // Sebarkan pilihan antar halaman tanpa mengubah prioritas di atas.
  const byPage=new Map();
  for(const m of eligible){if(!byPage.has(m.halaman))byPage.set(m.halaman,[]);byPage.get(m.halaman).push(m)}
  const pageNames=[...byPage.keys()].sort((a,b)=>parseInt(a.replace(/\D/g,''))-parseInt(b.replace(/\D/g,'')));
  const ordered=[];
  let round=0, added=true;
  while(added){
    added=false;
    for(const pg of pageNames){
      const list=byPage.get(pg);
      if(list[round]){ordered.push(list[round]);added=true;}
    }
    round++;
  }

  const pick=ordered.slice(0,n);
  try{
    for(const m of pick){
      await api(`/rest/v1/gas_members?halaman=eq.${encodeURIComponent(m.halaman)}&no=eq.${m.no}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({ditandai:true})});
      m.ditandai=true;
    }
    renderMarks();renderMembers();updateMarkInfo();updatePageMarkNotice();
    toast(`${pick.length} NIK ditandai`);
  }catch(e){toast("Gagal menandai: "+e.message)}
}

function showTab(t,b){activeTab=t;updateMarkedFloat();document.querySelectorAll("main>section").forEach(x=>x.classList.add("hidden"));document.getElementById(t).classList.remove("hidden");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(t==="tandai")renderMarks();if(t==="rekap")loadRecap(currentDate);if(t==="print")loadPrint()}
function printSheetForPage(page){
  const a=members.filter(m=>m.halaman===page).sort((x,y)=>+x.no-+y.no);
  let days=Array.from({length:30},(_,i)=>i+1);
  let rows=a.map(m=>{
    let cells=days.map(d=>{let x=inputs.find(i=>i.halaman===m.halaman&&+i.no===+m.no&&+i.tanggal===d&&periodMatch(i)&&i.nilai==='1');return `<td>${x?'<span class=\"print-check\">✓</span>':''}</td>`}).join('');
    return `<tr><td class="no">${esc(m.no)}</td><td class="name left">${esc(m.nama||'')}</td><td class="nik">${esc(m.nik||'')}</td><td class="cat">RT</td>${cells}</tr>`;
  }).join('');
  return `<div class="print-sheet">
    <div class="print-title">CATATAN PENJUALAN HARIAN PANGKALAN LPG 3KG</div>
    <div class="print-meta">Nama Pangkalan : ASEP TARJA &nbsp;&nbsp;&nbsp; No. Reg Pangkalan : ____________________<br>Alamat : ________________________________ &nbsp;&nbsp;&nbsp; MID LPG MAP : ____________________<br>Nama Agen Penyuplai : PT. SUMITA DAYA KELOLA &nbsp;&nbsp;&nbsp; Bulan : ${currentMonth===9?"SEPTEMBER":currentMonth===10?"OKTOBER":String(currentMonth).padStart(2,"0")} ${currentYear}</div>
    <table class="print-grid"><colgroup><col style="width:28px"><col style="width:190px"><col style="width:175px"><col style="width:40px">${days.map(()=>`<col style="width:22px">`).join('')}</colgroup><thead>
      <tr><th class="no" colspan=4>TANGGAL</th>${days.map(d=>`<th class="day">${d}</th>`).join('')}</tr>
      <tr><th class="no">No</th><th class="name">Nama Pembeli</th><th class="nik">NIK Pembeli</th><th class="cat">Kategori</th>${days.map(d=>`<th class="day">${d}</th>`).join('')}</tr>
    </thead><tbody>${rows}</tbody><tfoot><tr><th colspan=4>TOTAL</th>${days.map(d=>{let n=inputs.filter(i=>i.halaman===page&&+i.tanggal===d&&i.nilai==='1'&&periodMatch(i)).length;return `<th>${n}</th>`}).join('')}</tr></tfoot></table>
    <div style="font-size:9px;margin-top:5px">Halaman ${page.replace(/^HAL\s*/i,'')} &nbsp; • &nbsp; ✓ = sudah ada input</div>
  </div>`;
}
function loadPrint(){document.getElementById("printBody").innerHTML=`<div class="print-preview">${printSheetForPage(currentPrintPage)}</div>`}
function printPage(page){currentPrintPage=page;buildPageBar(pages());loadPrint();setTimeout(()=>window.print(),100)}
function printAllPages(){document.getElementById("printBody").innerHTML=`<div class="print-preview">${pages().map(printSheetForPage).join('')}</div>`;setTimeout(()=>window.print(),100)}
